<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <style>
    .card {
      border: 1px solid #aaa;
      padding: 16px;
      margin: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Student Profile</h1>
  <div id="card"></div>

  <script>
    const user = {
      name: "Riya",
      city: "Delhi",
      course: "BCA"
    };

    const card = document.querySelector("#card");

    card.innerHTML = `
      <div class="card">
        <h2>${user.name}</h2>
        <p>City: ${user.city}</p>
        <p>Course: ${user.course}</p>
      </div>
    `;
  </script>
</body>
</html>
